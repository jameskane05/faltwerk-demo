<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A WebGPU / WebXR demo of Faltwerk.">
<title>4DGS Compression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e8e4dc;
    --mute: #9a958c;
    --line: rgba(232, 228, 220, 0.14);
    --panel: rgba(12, 14, 16, 0.72);
    --accent: #c8f135;
    --accent-ink: #12140e;
    --danger: #ffb454;
    --font-display: "Syne", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070809; color: var(--ink); overflow: hidden; }
  body { font: 13px/1.45 var(--font-mono); }

  #c {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block; touch-action: none;
    background: #070809;
  }

  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.25rem, 4vw, 3rem);
    padding-top: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    background: transparent;
    pointer-events: none;
  }
  #intro .hit { pointer-events: auto; }
  .intro-top { align-self: start; max-width: min(36rem, 100%); margin-top: 2.4rem; }
  .intro-bottom { align-self: start; max-width: min(52rem, 100%); }

  .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    letter-spacing: -0.04em;
    line-height: 0.92;
    margin: 0 0 0.85rem;
    max-width: 12ch;
    color: #fff;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55);
  }
  .lede {
    max-width: 36rem;
    margin: 0;
    color: var(--mute);
    font-size: clamp(0.92rem, 2.2vw, 1.05rem);
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  .lede a { color: var(--ink); text-decoration: underline; text-underline-offset: 0.18em; }
  .lede a:hover { color: var(--accent); }

  .meta, .perf {
    display: flex; flex-wrap: wrap; gap: 0.85rem 1.5rem;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  .meta { margin: 0 0 0.85rem; }
  .perf { margin: 0 0 1.1rem; }
  .meta span, .perf span { color: var(--mute); display: block; }
  .meta strong, .perf strong {
    color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .meta a, .actions a {
    color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 0.18em;
  }
  .meta a:hover, .actions a:hover { color: var(--accent); }

  .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }
  .actions a {
    appearance: none; border: 0; cursor: pointer;
    font: 500 0.85rem/1 var(--font-mono);
    letter-spacing: 0.02em;
    padding: 0.85rem 1.15rem;
    text-decoration: none;
    background: transparent; color: var(--ink);
    outline: 1px solid var(--line);
  }
  .actions a:hover { outline-color: var(--ink); }

  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.65rem;
    padding: 0.65rem 0.8rem;
    padding-top: max(0.65rem, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(7, 8, 9, 0.78), rgba(7, 8, 9, 0));
    color: var(--ink);
    pointer-events: none;
  }
  #hud button, #hud label, #hud select, #hud summary, #hud a, #hud input {
    pointer-events: auto;
  }
  #hud button, #hud select, #grade-box summary {
    appearance: none;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 0;
    font: 500 12px/1.2 var(--font-mono);
    padding: 0.45rem 0.65rem;
    cursor: pointer;
  }
  #hud button:hover, #grade-box summary:hover { border-color: rgba(232, 228, 220, 0.35); }
  #hud label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--mute); }
  #hud input[type=color] {
    width: 1.5rem; height: 1.1rem; padding: 0; border: 1px solid var(--line);
    background: transparent; vertical-align: middle;
  }
  #hud input[type=checkbox] { accent-color: var(--accent); }
  #occ-box, #occ-debug-box { display: none !important; }
  #recolor-info { color: var(--mute); }
  #grade-box { position: relative; }
  #grade-box summary { list-style: none; }
  #grade-box summary::-webkit-details-marker { display: none; }
  #grade-panel {
    position: absolute; left: 0; top: calc(100% + 0.35rem); z-index: 2;
    white-space: nowrap;
    background: rgba(10, 12, 14, 0.92);
    border: 1px solid var(--line);
    padding: 0.65rem 0.75rem;
    backdrop-filter: blur(8px);
  }
  #grade-rows { display: grid; gap: 0.2rem; margin-top: 0.45rem; }
  #grade-rows label {
    display: grid; grid-template-columns: 5.2rem 9rem 3.6rem;
    align-items: center; gap: 0.4rem; margin: 0; color: var(--ink);
  }
  #grade-rows input[type=number] {
    width: 3.4rem; background: #111; color: var(--ink); border: 1px solid var(--line);
    font: 12px var(--font-mono); padding: 0.2rem 0.3rem;
  }
  /* Player still writes here; we mirror into the bottom perf row. */
  #stats { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #xr-hint {
    flex-basis: 100%;
    color: var(--danger);
    margin-top: 0.15rem;
    max-width: 56rem;
  }
  #xr-ar {
    background: var(--accent) !important;
    color: var(--accent-ink) !important;
    border-color: transparent !important;
    font-weight: 700 !important;
  }

  @media (max-width: 640px) {
    .brand { max-width: 9ch; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="intro" aria-label="About this demo">
  <div class="hit intro-top">
    <h1 class="brand">4DGS Compression</h1>
    <p class="lede">
      A WebGPU / WebXR demo of
      <a href="https://github.com/edrethardo/Faltwerk">Faltwerk</a>
    </p>
  </div>
  <div class="hit intro-bottom">
    <div class="meta">
      <div><span>Authors</span><strong>Aaron Nowak · James Kane</strong></div>
      <div><span>Codec</span><a href="https://github.com/edrethardo/Faltwerk" target="_blank" rel="noopener"><strong>Faltwerk</strong></a></div>
      <div><span>Capture</span><strong>iPhone Air</strong></div>
      <div><span>Processing</span><a href="https://github.com/ant-research/4DAnyone" target="_blank" rel="noopener"><strong>4DAnyone</strong></a></div>
    </div>
    <div class="perf" aria-live="polite">
      <div><span>FPS</span><strong id="stat-fps">…</strong></div>
      <div><span>Time</span><strong id="stat-time">…</strong></div>
      <div><span>Splats</span><strong id="stat-splats">…</strong></div>
      <div><span>GPU</span><strong id="stat-gpu">…</strong></div>
      <div><span>VRAM</span><strong id="stat-vram">…</strong></div>
      <div><span>Bitrate</span><strong id="stat-mbps">…</strong></div>
    </div>
    <div class="actions">
      <a class="btn-ghost" id="quest-link" href="?quest=1" hidden>Quest 3 MR</a>
      <a href="https://github.com/edrethardo/Faltwerk" target="_blank" rel="noopener">Main repo</a>
    </div>
  </div>
</section>

<div id="hud">
  <button id="play" type="button">▶/❚❚</button>
  <button id="hold" type="button" data-de="Anhalten">Hold</button>
  <select id="scene" hidden></select>
  <label><span data-de="Hintergrund">Background</span> <input id="bg" type="color" value="#d9d4cc"></label>
  <span id="occ-box" hidden><input id="occ" type="checkbox" checked></span>
  <span id="occ-debug-box" hidden><input id="occ-debug" type="checkbox"></span>
  <details id="grade-box" hidden>
    <summary data-de="Farbe">Colour</summary>
    <div id="grade-panel">
      <div>
        <label title="Estimate a grade from the headset's room camera when MR starts; moving any slider switches back to manual" data-de-title="Schätzt beim MR-Start eine Farbkorrektur aus der Raumkamera; jeder Regler schaltet zurück auf manuell">
          <input id="recolor" type="checkbox"><span data-de="Auto aus Raum">Auto from room</span>
        </label>
        <label id="desk-box" hidden title="Pinchable slider desk next to you in MR; pinch its tray to carry it" data-de-title="Greifbares Reglerpult neben dir in MR; am Brett greifen, um es zu tragen">
          <input id="desk" type="checkbox" checked><span data-de="Pult in MR">Desk in MR</span>
        </label>
        <button id="grade-reset" type="button" data-de="Zurücksetzen">Reset</button>
      </div>
      <div id="grade-rows"></div>
    </div>
  </details>
  <span id="recolor-info"></span>
  <button id="xr-ar" type="button" hidden>MR</button>
  <span id="stats" data-de="lade …">loading …</span>
  <div id="xr-hint" hidden></div>
</div>

<script>
  const questLink = document.getElementById('quest-link');
  questLink.href = location.pathname.replace(/\/?$/, '/') + '?quest=1';
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => { if (ok) questLink.hidden = false; }).catch(() => {});
  }

  const sizeCache = new Map();
  const mbpsEl = document.getElementById('stat-mbps');
  async function sectionBytes(url) {
    if (sizeCache.has(url)) return sizeCache.get(url);
    let n = 0;
    try {
      const head = await fetch(url, { method: 'HEAD', cache: 'force-cache' });
      const len = Number(head.headers.get('content-length'));
      if (Number.isFinite(len) && len > 0) n = len;
    } catch {}
    if (!n) {
      try {
        const buf = await (await fetch(url, { cache: 'force-cache' })).arrayBuffer();
        n = buf.byteLength;
      } catch {}
    }
    sizeCache.set(url, n);
    return n;
  }

  async function updateBitrate(sceneName) {
    if (!sceneName || !mbpsEl) return;
    mbpsEl.textContent = '…';
    try {
      const sc = await (await fetch(sceneName, { cache: 'no-store' })).json();
      const secs = Array.isArray(sc.sections) ? sc.sections : [];
      const fps = Number(sc.fps) || 30;
      let frames = 0, bytes = 0;
      for (const s of secs) {
        frames += Number(s.nframes) || 0;
        bytes += await sectionBytes(s.url);
      }
      const sec = frames > 0 && fps > 0 ? frames / fps : 0;
      if (!bytes || !sec) { mbpsEl.textContent = '—'; return; }
      const mbps = (bytes * 8) / sec / 1e6;
      mbpsEl.textContent = (mbps >= 10 ? mbps.toFixed(1) : mbps.toFixed(2)) + ' Mbit/s';
    } catch {
      mbpsEl.textContent = '—';
    }
  }

  const sceneSel = document.getElementById('scene');
  const watchScene = () => { if (sceneSel?.value) updateBitrate(sceneSel.value); };
  sceneSel?.addEventListener('change', watchScene);
  let tries = 0;
  const boot = setInterval(() => {
    tries++;
    if (sceneSel?.options.length) { watchScene(); clearInterval(boot); }
    else if (tries > 80) clearInterval(boot);
  }, 100);

  // Mirror player #stats → bottom perf row.
  // Format: "… · 60 fps · section 0 t=12.34 · 135000 splats (12000 visible) · GPU 4.20 ms · 256 MiB"
  const els = {
    fps: document.getElementById('stat-fps'),
    time: document.getElementById('stat-time'),
    splats: document.getElementById('stat-splats'),
    gpu: document.getElementById('stat-gpu'),
    vram: document.getElementById('stat-vram'),
  };
  const statsNode = document.getElementById('stats');
  const applyStats = (text) => {
    if (!text || /lade|loading|Fehler|Error|GPU-Fehler/i.test(text)) return;
    const fps = text.match(/(\d+)\s*fps/i);
    const time = text.match(/\bt=([\d.]+)/i);
    const splats = text.match(/([\d,]+)\s*splats/i);
    const visible = text.match(/\(([\d,]+)\s*(?:sichtbar|visible)\)/i);
    const gpu = text.match(/GPU\s+([\d.]+)\s*ms/i);
    const vram = text.match(/([\d.]+)\s*MiB/i);
    if (fps) els.fps.textContent = fps[1];
    if (time) els.time.textContent = Number(time[1]).toFixed(2) + ' s';
    if (splats) {
      const n = splats[1].replace(/,/g, '');
      els.splats.textContent = visible
        ? `${Number(n).toLocaleString()} (${Number(visible[1].replace(/,/g, '')).toLocaleString()})`
        : Number(n).toLocaleString();
    }
    if (gpu) els.gpu.textContent = Number(gpu[1]).toFixed(2) + ' ms';
    if (vram) els.vram.textContent = vram[1] + ' MiB';
  };
  const mo = new MutationObserver(() => applyStats(statsNode.textContent || ''));
  mo.observe(statsNode, { characterData: true, childList: true, subtree: true });
  setInterval(() => applyStats(statsNode.textContent || ''), 250);
</script>
<script>
  try {
    const k = 'p5.bg';
    const v = (localStorage.getItem(k) || '').toLowerCase();
    if (!v || v === '#000000' || v === '#000') localStorage.setItem(k, '#d9d4cc');
  } catch {}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
