<!doctype html>
<html lang="en" data-orbit="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A WebGPU / WebXR demo of Faltwerk.">
<title>4DGS Compression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e8e4dc;
    --mute: #9a958c;
    --line: rgba(232, 228, 220, 0.14);
    --panel: rgba(12, 14, 16, 0.72);
    --accent: #c8f135;
    --accent-ink: #12140e;
    --danger: #ffb454;
    --font-display: "Syne", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070809; color: var(--ink); overflow: hidden; }
  body { font: 13px/1.45 var(--font-mono); }

  #c {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block; touch-action: none;
    background: #070809;
  }

  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.25rem, 4vw, 3rem);
    padding-top: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    background: transparent;
    pointer-events: none;
  }
  #intro .hit { pointer-events: auto; }
  .intro-top { align-self: start; max-width: min(48rem, 100%); margin-top: 2.4rem; }
  .intro-bottom { align-self: start; max-width: min(52rem, 100%); }

  .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    letter-spacing: -0.04em;
    line-height: 0.92;
    margin: 0;
    max-width: 12ch;
    color: #fff;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55);
  }
  .subhead {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1rem, 2.4vw, 1.35rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0.45rem 0 0;
    max-width: 40rem;
    color: var(--ink);
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  .subhead a { color: inherit; text-decoration: underline; text-underline-offset: 0.18em; }
  .subhead a:hover { color: var(--accent); }

  .meta, .perf {
    display: flex; flex-wrap: wrap; gap: 0.85rem 1.5rem;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  .meta { margin: 0 0 0.85rem; }
  .perf { margin: 0 0 0.7rem; }
  .meta span, .perf span { color: var(--mute); display: block; }
  .perf span em { font-style: normal; opacity: 0.75; }
  .meta strong, .perf strong {
    color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .meta a, .actions a {
    color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 0.18em;
  }
  .meta a:hover, .actions a:hover { color: var(--accent); }

  .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }
  .actions a {
    appearance: none; border: 0; cursor: pointer;
    font: 500 0.85rem/1 var(--font-mono);
    letter-spacing: 0.02em;
    padding: 0.85rem 1.15rem;
    text-decoration: none;
    background: transparent; color: var(--ink);
    outline: 1px solid var(--line);
  }
  .actions a:hover { outline-color: var(--ink); }

  #hud {
    position: static;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.65rem;
    margin: 0 0 0.85rem;
    padding: 0;
    background: none;
    color: var(--ink);
    pointer-events: none;
  }
  #hud button, #hud label, #hud select, #hud summary, #hud a, #hud input, #grade-panel {
    pointer-events: auto;
  }
  #hud button, #hud select, #grade-box summary {
    appearance: none;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 0;
    font: 500 12px/1.2 var(--font-mono);
    padding: 0.45rem 0.65rem;
    cursor: pointer;
  }
  #hud button:hover, #grade-box summary:hover { border-color: rgba(232, 228, 220, 0.35); }
  #hud label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--mute); }
  #hud label:has(#camviz), #hud label:has(#orbit) {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    font: 500 12px/1.2 var(--font-mono);
    padding: 0.45rem 0.65rem;
    gap: 0.45rem;
    cursor: pointer;
  }
  #hud label:has(#camviz):hover, #hud label:has(#orbit):hover { border-color: rgba(232, 228, 220, 0.35); }
  #hold[aria-expanded="true"] { border-color: rgba(232, 228, 220, 0.55); }
  .color-settings { position: relative; }
  #grade-box {
    position: absolute; left: 0; bottom: calc(100% + 0.35rem); z-index: 6;
  }
  #hud input[type=color] {
    width: 1.15rem; height: 0.85rem; padding: 0; border: 1px solid rgba(232, 228, 220, 0.35);
    background: transparent; vertical-align: middle;
  }
  #hud input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  #hud label:has(#camviz) input, #hud label:has(#orbit) input {
    appearance: none;
    width: 0.8rem; height: 0.8rem;
    border: 1px solid rgba(232, 228, 220, 0.55);
    background: transparent center / 0.7rem no-repeat;
  }
  #hud label:has(#camviz) input:checked, #hud label:has(#orbit) input:checked {
    background-color: var(--ink);
    border-color: var(--ink);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 6.2 4.6 9 10 3' fill='none' stroke='%2312140e' stroke-width='2'/></svg>");
  }
  #occ-box, #occ-debug-box { display: none !important; }
  #recolor-info { color: var(--mute); }
  #grade-panel {
    white-space: nowrap;
    background: rgba(10, 12, 14, 0.92);
    border: 1px solid var(--line);
    padding: 0.65rem 0.75rem;
    backdrop-filter: blur(8px);
  }
  #grade-panel .bg-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1.25rem; margin: 0 0 0.7rem; padding: 0 0 0.65rem;
    background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink);
    font: 500 12px/1.2 var(--font-mono);
  }
  #grade-panel .bg-pick {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.28rem 0.5rem 0.28rem 0.28rem;
    border: 1px solid rgba(232, 228, 220, 0.7);
    background: #121416;
    cursor: pointer;
  }
  #grade-panel .bg-pick:hover { border-color: var(--ink); }
  #grade-panel .bg-pick input[type=color] {
    -webkit-appearance: none; appearance: none;
    width: 2.75rem; height: 1.55rem; padding: 0; margin: 0;
    border: 0; background: none; cursor: pointer;
  }
  #grade-panel .bg-pick input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  #grade-panel .bg-pick input[type=color]::-webkit-color-swatch { border: none; }
  #grade-panel .bg-pick input[type=color]::-moz-color-swatch { border: none; }
  #grade-panel .bg-pick #bg-hex {
    color: var(--ink); font: 500 12px/1 var(--font-mono); letter-spacing: 0.02em;
  }
  #grade-panel > div:has(#grade-reset) {
    display: flex; justify-content: flex-end; margin: 0 0 0.15rem;
  }
  #grade-rows { display: grid; gap: 0.2rem; margin-top: 0.45rem; }
  #grade-rows label {
    display: grid; grid-template-columns: 5.2rem 9rem 3.6rem;
    align-items: center; gap: 0.4rem; margin: 0; color: var(--ink);
  }
  #grade-rows input[type=number] {
    width: 3.4rem; background: #111; color: var(--ink); border: 1px solid var(--line);
    font: 12px var(--font-mono); padding: 0.2rem 0.3rem;
  }
  /* Player still writes here; we mirror into the bottom perf row. */
  #stats { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #xr-hint {
    flex-basis: 100%;
    color: var(--danger);
    margin-top: 0.15rem;
    max-width: 56rem;
  }
  #xr-ar {
    background: var(--accent) !important;
    color: var(--accent-ink) !important;
    border-color: transparent !important;
    font-weight: 700 !important;
  }

  @media (max-width: 640px) {
    .brand { max-width: 9ch; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="intro" aria-label="About this demo">
  <div class="hit intro-top">
    <h1 class="brand">Faltwerk</h1>
    <p class="subhead">A WebGPU + WebXR demo of <a href="https://github.com/edrethardo/Faltwerk" target="_blank" rel="noopener">our 4DGS Compression Codec</a></p>
  </div>
  <div class="hit intro-bottom">
    <div class="meta">
      <div><span>Authors</span><strong><a href="https://github.com/edrethardo" target="_blank" rel="noopener">Aaron Nowak</a> · <a href="https://jamesckane.com" target="_blank" rel="noopener">James C. Kane</a></strong></div>
      <div><span>Capture</span><strong>iPhone Air</strong></div>
      <div><span>Novel Views</span><a href="https://github.com/ant-research/4DAnyone" target="_blank" rel="noopener"><strong>4DAnyone</strong></a></div>
      <div><span>Codec</span><a href="https://github.com/edrethardo/Faltwerk" target="_blank" rel="noopener"><strong>Faltwerk</strong></a></div>
    </div>
    <div class="perf" aria-live="polite">
      <div><span>FPS</span><strong id="stat-fps">…</strong></div>
      <div><span>GPU</span><strong id="stat-gpu">…</strong></div>
      <div><span>Bitrate</span><strong id="stat-mbps">…</strong></div>
      <div><span>Size</span><strong id="stat-bytes">…</strong></div>
      <div><span>Splats <em>(total · drawn)</em></span><strong id="stat-splats">…</strong></div>
    </div>
    <div id="hud" class="hit">
      <button id="play" type="button">▶/❚❚</button>
      <div class="color-settings">
        <button id="hold" type="button" aria-expanded="false" aria-controls="grade-panel">Color Settings</button>
        <div id="grade-box" hidden>
          <div id="grade-panel">
            <label class="bg-row"><span data-de="Hintergrundfarbe">Background Color</span><span class="bg-pick"><input id="bg" type="color" value="#d9d4cc" aria-label="Background color"><span id="bg-hex">#d9d4cc</span></span></label>
            <div>
            <button id="grade-reset" type="button" data-de="Zurücksetzen">Reset</button>
          </div>
          <div id="grade-rows"></div>
          </div>
        </div>
      </div>
      <select id="scene" hidden></select>
      <label title="Show capture-camera frustums and view thumbnails around the subject"><input id="camviz" type="checkbox" checked><span>Cameras</span></label>
      <label title="Orbit from the current angle and distance. Click-drag pauses it; it resumes after 15s idle. Zoom keeps it going."><input id="orbit" type="checkbox" checked><span data-de="Animation">Animate</span></label>
      <span id="occ-box" hidden><input id="occ" type="checkbox"></span>
      <span id="occ-debug-box" hidden><input id="occ-debug" type="checkbox"></span>
      <span id="recolor-info"></span>
      <button id="xr-ar" type="button" hidden>MR</button>
      <span id="stats" data-de="lade …">loading …</span>
      <div id="xr-hint" hidden></div>
    </div>
    <div class="actions">
      <a class="btn-ghost" id="quest-link" href="?quest=1" hidden>Quest 3 MR</a>
    </div>
  </div>
</section>

<script>
  const questLink = document.getElementById('quest-link');
  const onQuest = /OculusBrowser|\bQuest\b/i.test(navigator.userAgent);
  questLink.href = location.pathname.replace(/\/?$/, '/') + '?quest=1';
  if (!onQuest && navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => { if (ok) questLink.hidden = false; }).catch(() => {});
  }

  const sizeCache = new Map();
  const mbpsEl = document.getElementById('stat-mbps');
  const bytesEl = document.getElementById('stat-bytes');
  async function sectionBytes(url) {
    if (sizeCache.has(url)) return sizeCache.get(url);
    let n = 0;
    try {
      const head = await fetch(url, { method: 'HEAD', cache: 'force-cache' });
      const len = Number(head.headers.get('content-length'));
      if (Number.isFinite(len) && len > 0) n = len;
    } catch {}
    if (!n) {
      try {
        const buf = await (await fetch(url, { cache: 'force-cache' })).arrayBuffer();
        n = buf.byteLength;
      } catch {}
    }
    sizeCache.set(url, n);
    return n;
  }

  let clipGen = 0;
  let shownScene = '';
  async function updateClipStats(sceneName) {
    const mine = ++clipGen;
    if (mbpsEl) mbpsEl.textContent = '…';
    if (bytesEl) bytesEl.textContent = '…';
    try {
      const sc = await (await fetch(sceneName, { cache: 'no-store' })).json();
      const secs = Array.isArray(sc.sections) ? sc.sections : [];
      const fps = Number(sc.fps) || 30;
      let frames = 0, bytes = 0;
      for (const s of secs) {
        frames += Number(s.nframes) || 0;
        bytes += await sectionBytes(s.url);
      }
      if (mine !== clipGen) return;
      const sec = frames > 0 && fps > 0 ? frames / fps : 0;
      if (!bytes || !sec) {
        if (mbpsEl) mbpsEl.textContent = '—';
        if (bytesEl) bytesEl.textContent = '—';
        return;
      }
      const mbps = (bytes * 8) / sec / 1e6;
      if (mbpsEl) mbpsEl.textContent = (mbps >= 10 ? mbps.toFixed(1) : mbps.toFixed(2)) + ' Mbit/s';
      if (bytesEl) bytesEl.textContent = (bytes / 1048576).toFixed(2) + ' MiB';
    } catch {
      if (mine !== clipGen) return;
      if (mbpsEl) mbpsEl.textContent = '—';
      if (bytesEl) bytesEl.textContent = '—';
    }
  }

  const sceneSel = document.getElementById('scene');
  // The player swaps clips by assigning select.value, which does not fire change.
  const watchScene = () => {
    const v = sceneSel && sceneSel.value;
    if (!v || v === shownScene) return;
    shownScene = v;
    updateClipStats(v);
  };
  sceneSel?.addEventListener('change', () => { shownScene = ''; watchScene(); });

  // Mirror player #stats → bottom perf row.
  // Format: "… · 60 fps · section 0 t=12.34 · 135000 splats (12000 visible) · GPU 4.20 ms · 256 MiB"
  const els = {
    fps: document.getElementById('stat-fps'),
    splats: document.getElementById('stat-splats'),
    gpu: document.getElementById('stat-gpu'),
  };
  const statsNode = document.getElementById('stats');
  const applyStats = (text) => {
    if (!text || /lade|loading|Fehler|Error|GPU-Fehler/i.test(text)) return;
    const fps = text.match(/(\d+)\s*fps/i);
    const splats = text.match(/([\d,]+)\s*splats/i);
    const visible = text.match(/\(([\d,]+)\s*(?:sichtbar|visible)\)/i);
    const gpu = text.match(/GPU\s+([\d.]+)\s*ms/i);
    if (fps) els.fps.textContent = fps[1];
    if (splats) {
      const n = Number(splats[1].replace(/,/g, '')).toLocaleString();
      const v = visible ? Number(visible[1].replace(/,/g, '')).toLocaleString() : '—';
      els.splats.textContent = `${n} · ${v}`;
    }
    if (gpu) els.gpu.textContent = Number(gpu[1]).toFixed(2) + ' ms';
  };
  const mo = new MutationObserver(() => applyStats(statsNode.textContent || ''));
  mo.observe(statsNode, { characterData: true, childList: true, subtree: true });
  setInterval(() => { applyStats(statsNode.textContent || ''); watchScene(); }, 250);
</script>
<script>
  try {
    const k = 'p5.bg';
    const v = (localStorage.getItem(k) || '').toLowerCase();
    if (!v || v === '#000000' || v === '#000') localStorage.setItem(k, '#d9d4cc');
  } catch {}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
