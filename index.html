<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4DGS Holograms</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; }
  #c { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 8px; right: 8px; color: #cfd; text-shadow: 0 0 3px #000; pointer-events: none; }
  #hud button, #hud label, #hud select { pointer-events: auto; margin-right: 6px; }
  #hud input[type=color] { width: 28px; height: 18px; padding: 0; border: 0; vertical-align: middle; background: none; }
  #recolor-info { margin-right: 6px; opacity: 0.8; }
  #grade-box { display: inline-block; position: relative; pointer-events: auto; margin-right: 6px; }
  #grade-box summary { cursor: pointer; }
  #grade-panel { position: absolute; left: 0; top: 100%; z-index: 1; white-space: nowrap; background: rgba(0, 0, 0, 0.6); padding: 6px 8px; border-radius: 4px; margin-top: 4px; }
  #grade-rows { display: grid; grid-template-columns: auto; gap: 2px; margin-top: 4px; }
  #grade-rows label { display: grid; grid-template-columns: 80px 140px 56px; align-items: center; gap: 6px; margin: 0; }
  #grade-rows input[type=number] { width: 52px; background: #111; color: #cfd; border: 1px solid #344; }
  #stats { white-space: pre-wrap; }
  #xr-hint { color: #fd8; margin-top: 4px; max-width: 60em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button id="play" type="button">▶/❚❚</button><button id="hold" type="button" data-de="Anhalten">Hold</button><select id="scene" hidden></select><label><span data-de="Hintergrund">Background</span> <input id="bg" type="color" value="#000000"></label><label id="occ-box" hidden><input id="occ" type="checkbox" checked><span data-de="Hände verdecken">Hands occlude</span></label><label id="occ-debug-box" hidden><input id="occ-debug" type="checkbox"><span data-de="Verdeckung rot zeigen">Show occlusion in red</span></label><details id="grade-box" hidden><summary data-de="Farbe">Colour</summary><div id="grade-panel"><div><label title="Estimate a grade from the headset's room camera when MR starts; moving any slider switches back to manual" data-de-title="Schätzt beim MR-Start eine Farbkorrektur aus der Raumkamera; jeder Regler schaltet zurück auf manuell"><input id="recolor" type="checkbox"><span data-de="Auto aus Raum">Auto from room</span></label><label id="desk-box" hidden title="Pinchable slider desk next to you in MR; pinch its tray to carry it" data-de-title="Greifbares Reglerpult neben dir in MR; am Brett greifen, um es zu tragen"><input id="desk" type="checkbox" checked><span data-de="Pult in MR">Desk in MR</span></label><button id="grade-reset" type="button" data-de="Zurücksetzen">Reset</button></div><div id="grade-rows"></div></div></details><span id="recolor-info"></span><button id="xr-ar" type="button" hidden>MR</button><span id="stats" data-de="lade …">loading …</span><div id="xr-hint" hidden></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
